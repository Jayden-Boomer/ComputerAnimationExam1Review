tion as a way to represent a three-dimensional entity. Its hint names x, y, z and coefficients A, B, C, D. This is a representation question: how an entity is described. It is separate from a transformation question: how that entity is moved, turned, or resized.", "why": "For the supplied Q4, Equation is the intended answer. Do not turn that key into a claim that polygon models or other representations are invalid. The question is broadly worded; the files do not present a full taxonomy of 3D model representations.", "mechanism": "Q4 asks which listed representation represents a three-dimensional object and keys Equation. Its hint refers to three variables x, y, z and four coefficients A, B, C, D. The sheet does not provide a specific equation or say that every 3D object uses the same equation.", "example": "Selecting Equation in Q4 describes a representation. Selecting Scaling in Q2 describes changing size. Keeping representation and operation separate helps you recognize which kind of answer is being requested.", "connection": "The exam review lists Vector, Matrix, 3D Model, and Render Pipeline under graphics fundamentals. The sample sheet gives matrix and homogeneous-coordinate facts in the next lesson, plus the representation hint here. It gives no vector operations or pipeline-stage descriptions.", "terms": [{"name": "Equation representation", "definition": "Q4 asks which listed representation represents a three-dimensional object and keys Equation. Its hint refers to three variables x, y, z and four coefficients A, B, C, D. The sheet does not provide a specific equation or say that every 3D object uses the same equation.", "cue": "Q4 intended answer: Equation."}, {"name": "Representation is not exclusive", "definition": "For the supplied Q4, Equation is the intended answer. Do not turn that key into a claim that polygon models or other representations are invalid. The question is broadly worded; the files do not present a full taxonomy of 3D model representations.", "cue": "The hint names x, y, z."}, {"name": "Representation versus transformation", "definition": "Selecting Equation in Q4 describes a representation. Selecting Scaling in Q2 describes changing size. Keeping representation and operation separate helps you recognize which kind of answer is being requested.", "cue": "The hint names A, B, C, D."}, {"name": "Graphics fundamentals coverage", "definition": "The exam review lists Vector, Matrix, 3D Model, and Render Pipeline under graphics fundamentals. The sample sheet gives matrix and homogeneous-coordinate facts in the next lesson, plus the representation hint here. It gives no vector operations or pipeline-stage descriptions.", "cue": "Representation describes an entity; transformations act on it."}], "points": ["Q4 intended answer: Equation.", "The hint names x, y, z.", "The hint names A, B, C, D.", "Representation describes an entity; transformations act on it."], "source": "Sample Q4; Exam review: Vector, Matrix, 3D Model, Render Pipeline", "diagram": null, "comparison": [["Question focus", "What to look for", "Sample connection"], ["Representation", "How a 3D entity is described", "Q4 accepts Equation."], ["Transformation", "An operation applied to an entity", "Q2 accepts Scaling for changing size."], ["Matrix representation", "A consistent representation for transformations", "Q3 and Q5 in the next lesson."]], "limits": "Vector definitions/operations, a complete 3D-model taxonomy, and render-pipeline stages are topic-only in the review image. Lecture-level coverage of those topics cannot be recovered from these attachments."}, {"id": "homogeneous", "module": "m2", "title": "Homogeneous coordinates & matrices", "first": "Homogeneous coordinates add a fourth coordinate to the 3D point representation used in the sample. The sheet represents a point (x, y, z) as (x, y, z, 1) and uses a 4 × 4 general 3D transformation matrix. The stated reason is to treat translation, rotation, and scaling consistently.", "why": "Q5 identifies the reason for homogeneous coordinates and matrix representation: all three transformations can be treated in a consistent way. A choice that says only “to scale” or only “to rotate” captures one operation but misses the common framework.", "mechanism": "A general 3D transformation matrix is 4 × 4 according to Q3. That means four rows and four columns. The size matches the four-entry homogeneous representation used by Q6. This lesson does not assume a row-vector or column-vector convention.", "example": "A point (2, −3, 5) is written (2, −3, 5, 1) using the Q6 convention. A 3 × 3 matrix would miss the size specified in Q3. These examples apply the supplied representation directly.", "connection": "The common framework supports the three geometric operations in Geometric Transformations and the idea of performing transformations in sequence. The sheet does not provide the entries of translation, rotation, or scaling matrices.", "terms": [{"name": "Homogeneous point", "definition": "Q6 uses the homogeneous point (x, y, z, 1). The first three entries keep the original spatial coordinates; the appended entry is 1 in this point representation. The hint does not classify other possible fourth-coordinate values.", "cue": "3D point: (x, y, z) → (x, y, z, 1)."}, {"name": "Consistent transformation framework", "definition": "Q5 identifies the reason for homogeneous coordinates and matrix representation: all three transformations can be treated in a consistent way. A choice that says only “to scale” or only “to rotate” captures one operation but misses the common framework.", "cue": "General 3D transformation matrix: 4 × 4."}, {"name": "General 3D transformation matrix", "definition": "A general 3D transformation matrix is 4 × 4 according to Q3. That means four rows and four columns. The size matches the four-entry homogeneous representation used by Q6. This lesson does not assume a row-vector or column-vector convention.", "cue": "Four rows × four columns = 16 entries."}, {"name": "Homogeneous-coordinate example", "definition": "A point (2, −3, 5) is written (2, −3, 5, 1) using the Q6 convention. A 3 × 3 matrix would miss the size specified in Q3. These examples apply the supplied representation directly.", "cue": "Purpose: treat all three transformations consistently."}, {"name": "Matrices and composition", "definition": "The common framework supports the three geometric operations in Geometric Transformations and the idea of performing transformations in sequence. The sheet does not provide the entries of translation, rotation, or scaling matrices.", "cue": "Purpose: treat all three transformations consistently."}], "points": ["3D point: (x, y, z) → (x, y, z, 1).", "General 3D transformation matrix: 4 × 4.", "Four rows × four columns = 16 entries.", "Purpose: treat all three transformations consistently."], "source": "Sample Q3, Q5–6", "diagram": "homogeneous", "comparison": [["Representation", "Entries / dimensions", "What the sample tests"], ["Ordinary 3D point", "x, y, z", "Three spatial coordinates."], ["Homogeneous 3D point", "x, y, z, 1", "Append 1 to the point."], ["General 3D transformation matrix", "4 × 4", "Uniform matrix framework."]], "limits": null}, {"id": "transforms", "module": "m3", "title": "Translation, rotation & scaling", "first": "Translation changes position, rotation turns an object, and scaling changes its size. Q1’s hint lists these three operations even though its question says “types of geometric translation.” Study that as the three operations emphasized by this sample, rather than as a claim that rotation is a kind of translation.", "why": "For a scene that needs repositioning, turning, and resizing, identify each goal before choosing an operation. Several operations can be composed, but they remain conceptually distinct. Homogeneous coordinates let the three be treated consistently.", "mechanism": "Use translation when the goal is moving an object to a different position. It is the position-changing operation in the trio supplied by Q1. In the demonstration below, the same shape is shifted without being turned or resized.", "example": "For a scene that needs repositioning, turning, and resizing, identify each goal before choosing an operation. Several operations can be composed, but they remain conceptually distinct. Homogeneous coordinates let the three be treated consistently.", "connection": "For a scene that needs repositioning, turning, and resizing, identify each goal before choosing an operation. Several operations can be composed, but they remain conceptually distinct. Homogeneous coordinates let the three be treated consistently.", "terms": [{"name": "Translation", "definition": "Use translation when the goal is moving an object to a different position. It is the position-changing operation in the trio supplied by Q1. In the demonstration below, the same shape is shifted without being turned or resized.", "cue": "Translation → position."}, {"name": "Rotation", "definition": "Use rotation when the goal is turning an object. Q1 writes “Rotate” in its hint. Keep that terminology visible, while recognizing Rotation as the operation name used in the other sample questions.", "cue": "Rotation / Rotate → turning."}, {"name": "Scaling", "definition": "Q2 states that scaling changes or modifies size. Its hint says size can increase or decrease. A request to zoom in or out on the object is keyed to Scaling in that sample; this is not a lecture on camera zoom.", "cue": "Scaling / Scale → size increase or decrease."}, {"name": "Operation recognition", "definition": "For a scene that needs repositioning, turning, and resizing, identify each goal before choosing an operation. Several operations can be composed, but they remain conceptually distinct. Homogeneous coordinates let the three be treated consistently.", "cue": "Q1 expected count: 3 operations in its hint."}, {"name": "The sample’s three-operation hint", "definition": "The answer to Q1 is 3, supported by “Translation, Rotate, Scale.” That is a sample-specific trio, not an exhaustive list of every geometric transformation. Q2 includes Shearing as a distractor, but provides no explanation of it.", "cue": "Q2 zoom/resize answer: Scaling."}], "points": ["Translation → position.", "Rotation / Rotate → turning.", "Scaling / Scale → size increase or decrease.", "Q1 expected count: 3 operations in its hint.", "Q2 zoom/resize answer: Scaling."], "source": "Sample Q1–2; Q5; Exam review: Geometric Transformations", "diagram": "transform", "comparison": [["Operation", "Recognition clue", "Do not confuse with"], ["Translation", "Move / reposition", "Resizing or turning."], ["Rotation", "Turn / rotate", "Moving to a new position alone."], ["Scaling", "Increase / decrease size", "Turning or shifting alone."]], "limits": null}, {"id": "composition", "module": "m3", "title": "Composite transformations & a pivot", "first": "A composite transformation combines transformations performed in sequence. For rotation about an arbitrary point, the sample keys Translation → Rotation → Inverse Translation. Think of moving the chosen pivot to the rotation origin, turning there, and undoing that temporary move.", "why": "Q8 concerns an arbitrary rotation point. The initial translation relocates that chosen point to the place where the rotation is performed. The rotation follows, and the inverse of the initial translation restores the coordinate placement afterward.", "mechanism": "First: translate so the pivot becomes the rotation origin. Second: rotate. Third: apply the inverse of that first translation. “Inverse” means undoing the earlier move. The words alone do not specify matrix multiplication order or a vector convention.", "example": "Imagine a shape rotating about a marked point away from the origin. Temporarily move that marked point to the origin, turn the shape, then move the marked point back. The initial move is chosen for the pivot; the final move cancels it.", "connection": "Q8’s c is the supplied intended answer. Do not read “translation” as automatically meaning a positive displacement: the initial pivot-to-origin move and the final undoing move are a matched pair. Translation order wording can be ambiguous without that convention.", "terms": [{"name": "Composite transformation", "definition": "Q7 keys “Transformations that can be done in sequence.” The important word is sequence. A composite operation is understood by following the constituent operations in their order.", "cue": "Composite = transformations in sequence."}, {"name": "Arbitrary rotation pivot", "definition": "Q8 concerns an arbitrary rotation point. The initial translation relocates that chosen point to the place where the rotation is performed. The rotation follows, and the inverse of the initial translation restores the coordinate placement afterward.", "cue": "Sample Q8: Translation → Rotation → Inverse Translation."}, {"name": "Pivot rotation sequence", "definition": "First: translate so the pivot becomes the rotation origin. Second: rotate. Third: apply the inverse of that first translation. “Inverse” means undoing the earlier move. The words alone do not specify matrix multiplication order or a vector convention.", "cue": "Initial translation moves the pivot to the rotation origin."}, {"name": "Prepare, turn, restore", "definition": "Imagine a shape rotating about a marked point away from the origin. Temporarily move that marked point to the origin, turn the shape, then move the marked point back. The initial move is chosen for the pivot; the final move cancels it.", "cue": "Last translation undoes the first."}, {"name": "Translation-direction convention", "definition": "Q8’s c is the supplied intended answer. Do not read “translation” as automatically meaning a positive displacement: the initial pivot-to-origin move and the final undoing move are a matched pair. Translation order wording can be ambiguous without that convention.", "cue": "Rotation is the middle step."}], "points": ["Composite = transformations in sequence.", "Sample Q8: Translation → Rotation → Inverse Translation.", "Initial translation moves the pivot to the rotation origin.", "Last translation undoes the first.", "Rotation is the middle step."], "source": "Sample Q7–8", "diagram": "pivot", "comparison": [["Step", "Purpose", "Recognition clue"], ["1 · Translation", "Relocate the chosen pivot to the rotation origin", "Prepare."], ["2 · Rotation", "Perform the turn about that origin", "Turn."], ["3 · Inverse translation", "Undo the temporary translation", "Restore."]], "limits": "The sheet gives no transformation matrices or multiplication convention. Do not infer a left-to-right matrix product from the written execution sequence."}, {"id": "conics", "module": "m4", "title": "Conics: the sample distinction", "first": "For the supplied conics question, Hyperbola, Parabola, and Ellipse are the recognized family members; Line is the keyed exception. Treat this as the basic classification used by the review question. The files do not teach conic equations, construction methods, or degenerate cases.", "why": "Notice “does not.” You are choosing the exception, not a family member. Mark the three intended members first, then identify the remaining option.", "mechanism": "Q9 asks which option does not belong to the family of conics. The listed options are Hyperbola, Parabola, Ellipse, Line; its key is d, Line.", "example": "The conics question appears immediately before the Bézier questions in the sample sheet. Both concern curves, but conic classification and Bézier control-point structure are separate facts. The sheet does not equate the two representations.", "connection": "The conics question appears immediately before the Bézier questions in the sample sheet. Both concern curves, but conic classification and Bézier control-point structure are separate facts. The sheet does not equate the two representations.", "terms": [{"name": "Conic family in Q9", "definition": "Q9 asks which option does not belong to the family of conics. The listed options are Hyperbola, Parabola, Ellipse, Line; its key is d, Line.", "cue": "Q9 exception: Line."}, {"name": "Negative-question wording", "definition": "Notice “does not.” You are choosing the exception, not a family member. Mark the three intended members first, then identify the remaining option.", "cue": "Listed members: Hyperbola, Parabola, Ellipse."}, {"name": "Conics versus Bézier structure", "definition": "The conics question appears immediately before the Bézier questions in the sample sheet. Both concern curves, but conic classification and Bézier control-point structure are separate facts. The sheet does not equate the two representations.", "cue": "Read “does not belong” before choosing."}, {"name": "Basic classification boundary", "definition": "This app follows the sample’s basic classification. It does not turn the answer into a universal statement about every degenerate-conic convention, a topic not provided in the course attachments.", "cue": "No conic equations are supplied."}], "points": ["Q9 exception: Line.", "Listed members: Hyperbola, Parabola, Ellipse.", "Read “does not belong” before choosing.", "No conic equations are supplied."], "source": "Sample Q9", "diagram": null, "comparison": [["Option", "Role in Q9", "How to use it"], ["Hyperbola", "Family member", "Not the negative-answer choice."], ["Parabola", "Family member", "Not the negative-answer choice."], ["Ellipse", "Family member", "Not the negative-answer choice."], ["Line", "Keyed exception", "Choose for “does not belong.”"]], "limits": null}, {"id": "bezier", "module": "m4", "title": "Cubic Bézier curves & control points", "first": "Control points determine the Bézier curve’s shape. A cubic Bézier curve joins the first and last points using two interior control points. The sample calls those two interior points “control points,” which explains its answer of 2; conventional counting includes the endpoints and gives four total defining/control points.", "why": "Q11 says a cubic Bézier has 2 control points. Read that alongside Q12: two interior shape controls plus two endpoints. When a question says total control points in conventional terminology, count all four. When it says interior controls, count two.", "mechanism": "The two endpoints locate where the curve begins and ends. Changing the interior controls changes the shape between them. The diagram lets you move those controls while keeping the endpoints fixed. It illustrates the structural distinction without requiring a lecture formula.", "example": "Hold P0 and P3 fixed; move P1 and P2. The endpoints stay the same while the curve bends differently. This connects the shape-control answer in Q10 to Q12’s endpoint interpolation statement. The review names interpolation, but provides no other curve-interpolation methods.", "connection": "Hold P0 and P3 fixed; move P1 and P2. The endpoints stay the same while the curve bends differently. This connects the shape-control answer in Q10 to Q12’s endpoint interpolation statement. The review names interpolation, but provides no other curve-interpolation methods.", "terms": [{"name": "Bézier shape control", "definition": "Q10 keys Control points as what controls the shape. Q12’s best-supported choice says a cubic Bézier curve interpolates between the first and last points using two control points. Q12 has no supplied answer line; this app labels b as an interpreted answer.", "cue": "Shape controlled by control points (Q10)."}, {"name": "Interior versus total control points", "definition": "Q11 says a cubic Bézier has 2 control points. Read that alongside Q12: two interior shape controls plus two endpoints. When a question says total control points in conventional terminology, count all four. When it says interior controls, count two.", "cue": "Cubic = degree 3."}, {"name": "Endpoints and interior controls", "definition": "The two endpoints locate where the curve begins and ends. Changing the interior controls changes the shape between them. The diagram lets you move those controls while keeping the endpoints fixed. It illustrates the structural distinction without requiring a lecture formula.", "cue": "2 interior controls + 2 endpoints = 4 total."}, {"name": "Cubic degree", "definition": "Cubic means degree 3. Q12 offers degree 2 and an implicit cubic representation as distractors. Its intended description is interpolation between the first and last points. A cubic Bézier is usually described parametrically; that correction is labeled separately in the source notes.", "cue": "Sample Q11 key: 2, interpreted as interior controls."}, {"name": "Convex-hull property", "definition": "Q12 offers “may extend outside the convex hull of its control points” as a distractor. For the usual segment from start to end, the curve stays within the hull of its four defining points. This property supports interpreting b as Q12’s answer.", "cue": "Q12 interpreted answer: b; no supplied key."}, {"name": "Control-point example", "definition": "Hold P0 and P3 fixed; move P1 and P2. The endpoints stay the same while the curve bends differently. This connects the shape-control answer in Q10 to Q12’s endpoint interpolation statement. The review names interpolation, but provides no other curve-interpolation methods.", "cue": "Standard segment stays inside the control-point hull."}], "points": ["Shape controlled by control points (Q10).", "Cubic = degree 3.", "2 interior controls + 2 endpoints = 4 total.", "Sample Q11 key: 2, interpreted as interior controls.", "Q12 interpreted answer: b; no supplied key.", "Standard segment stays inside the control-point hull."], "source": "Sample Q10–12; Exam review: Cubic Curve / Interpolation", "diagram": "bezier", "comparison": [["Phrase", "Count / meaning", "Exam caution"], ["Interior control points", "2", "The interpretation that reconciles Q11 with Q12."], ["Endpoints", "2: first and last", "Interpolated by the segment."], ["Total defining/control points", "4 in conventional terminology", "Includes both endpoints."], ["Degree", "3", "Degree is not interior-control count."]], "limits": "No lecture slides, cubic basis matrices, interpolation formulas, Hermite/B-spline details, or curve-continuity rules were supplied. The four-total clarification is identified as a terminology correction to the sample."}, {"id": "quaternion", "module": "m5", "title": "Quaternion representation: four components", "first": "The supplied quaternion key selects a four-number representation, [x, y, z, w]. This gives a clear component-count fact to study. The original question is not a clean single-answer test, because it also includes other defensible mathematical statements; this app keeps the supplied key visible without using those statements as false distractors.", "why": "A homogeneous point (x, y, z, 1) also has four entries in this review, but it serves a different purpose. Merely seeing four entries does not prove that a value is a quaternion. Use the representation’s name and role, not the count alone.", "mechanism": "Q13’s key is b: Quaternion is a set of four numbers [x, y, z, w]. The ordered labels here follow the sample sheet. Count all four entries; do not confuse them with the ordinary three-coordinate point (x, y, z).", "example": "Option a says the quaternion number system extends the real numbers; option d discusses nonunique rotation representation. Those are defensible general statements. Option c says a rotation point and angle, which is not a precise component definition. The source nevertheless keys only b. The original wording is preserved in Source Notes.", "connection": "The exam review lists Quaternion / Interpolation, so quaternion interpolation is in scope for the real exam. The attachments do not explain interpolation algorithms, normalization, axis-angle conversion, multiplication, or Euler-angle comparisons. Those details are not invented here.", "terms": [{"name": "Quaternion components", "definition": "Q13’s key is b: Quaternion is a set of four numbers [x, y, z, w]. The ordered labels here follow the sample sheet. Count all four entries; do not confuse them with the ordinary three-coordinate point (x, y, z).", "cue": "Supplied Q13 key: b."}, {"name": "Quaternion versus homogeneous point", "definition": "A homogeneous point (x, y, z, 1) also has four entries in this review, but it serves a different purpose. Merely seeing four entries does not prove that a value is a quaternion. Use the representation’s name and role, not the count alone.", "cue": "Representation in the sheet: [x, y, z, w]."}, {"name": "Q13 answer ambiguity", "definition": "Option a says the quaternion number system extends the real numbers; option d discusses nonunique rotation representation. Those are defensible general statements. Option c says a rotation point and angle, which is not a precise component definition. The source nevertheless keys only b. The original wording is preserved in Source Notes.", "cue": "Four numbers; preserve the supplied component order."}, {"name": "Quaternion interpolation coverage", "definition": "The exam review lists Quaternion / Interpolation, so quaternion interpolation is in scope for the real exam. The attachments do not explain interpolation algorithms, normalization, axis-angle conversion, multiplication, or Euler-angle comparisons. Those details are not invented here.", "cue": "A four-entry homogeneous point is not automatically a quaternion."}], "points": ["Supplied Q13 key: b.", "Representation in the sheet: [x, y, z, w].", "Four numbers; preserve the supplied component order.", "A four-entry homogeneous point is not automatically a quaternion.", "Q13 wording is ambiguous as a single-answer question."], "source": "Sample Q13; Exam review: Quaternion / Interpolation", "diagram": "quaternion", "comparison": [["Object", "Representation in the files", "Purpose in this review"], ["Ordinary 3D point", "(x, y, z)", "Three spatial coordinates."], ["Homogeneous 3D point", "(x, y, z, 1)", "Consistent transformation representation."], ["Quaternion", "[x, y, z, w]", "Q13 four-number recognition."]], "limits": "Quaternion interpolation is listed but not explained. No LERP/SLERP formulas, unit-quaternion rules, or Euler-angle tradeoffs are available in the attachments."}, {"id": "robotics", "module": "mx", "title": "Two-link forward kinematics", "first": "For the 2D two-link robotic arm in Q16, forward kinematics uses two joint angles. Q17 says the base-to-end-effector transformation includes both rotation and translation. One fact counts joint-angle inputs; the other describes what the resulting frame transformation contains.", "why": "Do not confuse the number of joint angles with the number of effects in the frame transformation. Two angles is Q16’s input-count answer. Both rotation and translation is Q17’s transformation-content answer.", "mechanism": "Treat the two joint angles as the configuration information needed by this sample. The transformation from the base frame to the end-effector frame describes the relation between those frames, including both a positional and a rotational part.", "example": "If an answer says the end-effector transformation contains only translation, it misses rotation. If it says only rotation, it misses translation. The sample explicitly requires both.", "connection": "This example connects geometric transformations to a linked object: the end-effector has a relationship to the base frame that includes position and rotation. No link-length values or forward-kinematics equations are supplied.", "terms": [{"name": "Two-link 2D arm", "definition": "The sample names a 2D robotic arm with two links. Its answer is two joint angles for the forward-kinematics solution. The diagram shows the two joints and links as a visual interpretation of that stated setup.", "cue": "2D arm with two links → 2 joint angles (Q16)."}, {"name": "Forward-kinematics frame relation", " function renderReview(){const missed=missedList();if(reviewIndex>=missed.length)reviewIndex=Math.max(0,missed.length-1);const q=missed[reviewIndex];return `<div class="panel hero modehero"><div class="eyebrow">Deliberate practice</div><h1>Review Missed</h1><p>Return to questions you previously answered incorrectly. Unresolved misses are shown by default; you can also include already-mastered mistakes.</p><div class="statline"><span class="pill">${allMisses().length} ever missed</span><span class="pill">${QUESTIONS.filter(q=>progress.misses[q.id]&&!progress.done[q.id]).length} unresolved</span></div></div><div class="panel section"><div class="settingsrow"><button class="btn small ${!reviewIncludeSolved?'active':''}" data-act="review-filter" data-id="unresolved">Unresolved</button><button class="btn small ${reviewIncludeSolved?'active':''}" data-act="review-filter" data-id="all">All previously missed</button></div>${q?`<div class="studyline"><span class="qcounter">${reviewIndex+1} / ${missed.length} · Missed ${progress.misses[q.id]} time(s)</span><span class="small soft">${esc(LESSONBY[q.lesson].title)}</span></div>${quizNav(missed,reviewIndex,'review-index') }<div class="line"></div>${questionCard(q)}<div class="quizfooter"><button class="btn" data-act="review-prev" ${reviewIndex===0?'disabled':''}>← Previous</button><button class="btn primary" data-act="review-next" ${reviewIndex===missed.length-1?'disabled':''}>Next →</button></div>`:`<div class="empty">${allMisses().length?'No unresolved misses. All previously missed questions are mastered!':'No missed questions yet. Misses from lessons and mock exams will appear here.'}</div>`}</div>`}
function drawRandom(){let pool=randomScope==='all'?QUESTIONS:QUESTIONS.filter(q=>q.module===randomScope);const selected=[];const rem=[...pool];while(rem.length&&selected.length<15){const idx=Math.floor(Math.random()*rem.length);selected.push(rem.splice(idx,1)[0])}randomQuestions=selected;randomIndex=0;render()}
function renderRandom(){if(randomIndex>=randomQuestions.length)randomIndex=0;const q=randomQuestions[randomIndex];return `<div class="panel hero modehero"><div class="eyebrow">Quick randomized practice</div><h1>Random Practice</h1><p>Practice up to 15 questions from all topics or one topic, with immediate feedback and retries.</p></div><div class="panel section"><div class="settingsrow"><label class="soft" for="randomScope">Question pool</label><select class="select" id="randomScope" data-act="random-scope"><option value="all" ${randomScope==='all'?'selected':''}>All topics</option>${MODS.map(m=>`<option value="${m.id}" ${randomScope===m.id?'selected':''}>${esc(m.name)} · ${esc(m.subtitle)}</option>`).join('')}</select><button class="btn primary" data-act="random-generate">⤨ Generate 15 questions</button></div>${q?`<div class="studyline"><span class="qcounter">${randomIndex+1} / ${randomQuestions.length} · ${esc(LESSONBY[q.lesson].title)}</span></div>${quizNav(randomQuestions,randomIndex,'random-index')}<div class="line"></div>${questionCard(q)}<div class="quizfooter"><button class="btn" data-act="random-prev" ${randomIndex===0?'disabled':''}>← Previous</button><button class="btn primary" data-act="random-next" ${randomIndex===randomQuestions.length-1?'disabled':''}>Next →</button></div>`:`<div class="empty"><h3>Ready to practice?</h3><p>Choose a topic scope and generate a fresh short practice set.</p></div>`}</div>`}
function startMock(){const selected=[];const target={m1:4,m2:6,m3:7,m4:7,m5:4,mx:4,review:3};for(const m of MODS){const pool=QUESTIONS.filter(q=>q.module===m.id);let count=target[m.id];const bins=TIERS.map(t=>pool.filter(q=>q.tier===t).sort(()=>Math.random()-.5));let i=0;while(count-->0){const bin=bins[i++%bins.length];const next=bin.shift();if(next)selected.push(next)}}selected.sort(()=>Math.random()-.5);mock={questions:selected,answers:{},at:0,endAt:Date.now()+60*60000,duration:60*60,submitted:false,score:null,results:[],weak:[]};mode='mock';if(examTimerId)clearInterval(examTimerId);examTimerId=setInterval(tickMock,1000);save();render();window.scrollTo(0,0)}
function tickMock(){if(!mock||mock.submitted){clearInterval(examTimerId);return}let rem=Math.max(0,Math.ceil((mock.endAt-Date.now())/1000));const el=$('mockTimer');if(el)el.textContent=formatTime(rem);if(rem<=0)submitMock(true)}
function formatTime(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function submitMock(expired=false){if(!mock||mock.submitted)return;if(!expired&&!confirm('Submit the entire mock exam for grading? Solutions will be revealed only after submission.'))return;mock.submitted=true;if(examTimerId)clearInterval(examTimerId);let correct=0;const graded=[];const moduleCounts={};for(const q of mock.questions){const ans=mock.answers[q.id];const ok=isCorrect(q,ans);if(ok){correct++;progress.done[q.id]=true}else{delete progress.done[q.id];progress.misses[q.id]=(progress.misses[q.id]||0)+1}if(!moduleCounts[q.module])moduleCounts[q.module]={right:0,total:0};moduleCounts[q.module].total++;if(ok)moduleCounts[q.module].right++;graded.push({id:q.id,correct:ok,selected:ans})}mock.results=graded;mock.score=percent(correct,mock.questions.length);mock.weak=Object.entries(moduleCounts).map(([id,x])=>({id,pct:percent(x.right,x.total),...x})).sort((a,b)=>a.pct-b.pct);progress.mockLatest=mock.score;progress.mockBest=Math.max(progress.mockBest??0,mock.score);progress.mockHistory=[{date:new Date().toISOString(),score:mock.score,total:mock.questions.length},...(progress.mockHistory||[])].slice(0,12);save();render()}
function renderMock(){if(!mock)return `<div class="panel hero modehero"><div class="eyebrow">Timed simulated assessment</div><h1>Mock Exam · 60 minutes</h1><p>35 randomized questions across all topic groups, mixing multiple choice and select-all. Move back and forth freely; answers and explanations stay hidden until you submit.</p><div class="statsgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><b>35</b><small>questions</small></div><div class="stat"><b>60:00</b><small>timer</small></div><div class="stat"><b>${progress.mockBest==null?'—':progress.mockBest+'%'}</b><small>best score</small></div></div><button class="btn primary" data-act="mock-start">Begin mock exam →</button></div>`;
const answered=mock.questions.filter(q=>hasPicked(q,mock.answers[q.id])).length;const q=mock.questions[mock.at];if(mock.submitted)return `<div class="panel hero modehero"><div class="eyebrow">Mock exam results</div><h1>Exam submitted</h1><div class="examresults" style="margin-top:15px"><strong class="score">${mock.score}%</strong><p>${mock.results.filter(r=>r.correct).length} / ${mock.questions.length} correct · Best: ${progress.mockBest}% · Latest: ${progress.mockLatest}%</p><p class="small muted">All explanations are available below. Incorrect items were added to Review Missed.</p></div><div class="studyline" style="margin-top:14px"><button class="btn primary" data-act="mock-start">Try a new mock exam</button><button class="btn" data-act="mode" data-mode="review">Review missed items</button></div></div>
<section class="panel section"><h2>Weak topics & lesson focus</h2><p class="small soft" style="margin-top:5px">Sorted from lowest to highest performance on this attempt.</p><div class="module-cards" style="margin-top:13px">${mock.weak.map(x=>`<div class="module-card" style="--mc:${MODBY[x.id].color}"><h3>${esc(MODBY[x.id].name)} — ${esc(MODBY[x.id].subtitle)}</h3><div class="bar"><i style="width:${x.pct}%"></i></div><p>${x.right} / ${x.total} correct (${x.pct}%)</p></div>`).join('')}</div></section>
<section class="panel section"><h2>Complete answer review</h2><p class="small soft" style="margin-top:6px">Each answer includes the supported explanation. Open the linked lesson for more context.</p>${mock.questions.map((q,i)=>{const r=mock.results[i],ans=mock.answers[q.id];const a=(q.type==='multi'?(ans||[]):Number.isInteger(ans)?[ans]:[]);return `<div class="review-item"><div class="studyline"><span class="${r.correct?'pass':'fail'}">${r.correct?'✓ Correct':'✗ Incorrect'} · Question ${i+1}</span>${modChip(q.module)}</div><h3 style="margin-bottom:8px">${fmt(q.q)}</h3><p class="small soft"><b>Your answer:</b> ${a.length?a.map(j=>String.fromCharCode(65+j)+'. '+q.options[j]).map(esc).join('; '):'Unanswered'}</p><p class="small" style="color:#9eedc8"><b>Correct answer:</b> ${esc(answerNames(q))}</p><p class="small soft">${esc(q.sol)}</p><button class="btn small" data-act="lesson" data-id="${q.lesson}">Study ${esc(LESSONBY[q.lesson].title)} →</button></div>`}).join('')}</section>`;
return `<div class="panel hero modehero"><div class="studyline"><div><div class="eyebrow">Mock exam · solutions hidden</div><h1>Question ${mock.at+1} of ${mock.questions.length}</h1></div><div class="pill mono" style="font-size:17px;color:#9df3cf" id="mockTimer">${formatTime(Math.max(0,Math.ceil((mock.endAt-Date.now())/1000)))}</div></div><div class="bar" style="margin:14px 0"><i style="width:${percent(answered,mock.questions.length)}%"></i></div><div class="small soft">${answered} / ${mock.questions.length} answered · 60-minute timed attempt</div></div>
<section class="panel section"><div class="studyline"><span class="eyebrow">Question navigator</span><span class="pill">${esc(LESSONBY[q.lesson].title)}</span></div><div class="examgrid">${mock.questions.map((qq,i)=>`<button type="button" class="qnum ${i===mock.at?'current':''} ${hasPicked(qq,mock.answers[qq.id])?'answered':''}" data-act="mock-index" data-index="${i}" aria-label="Go to question ${i+1}">${i+1}</button>`).join('')}</div><div class="line"></div>${examQuestion(q,mock.answers[q.id],false)}<div class="quizfooter"><button class="btn" data-act="mock-prev" ${mock.at===0?'disabled':''}>← Previous</button><button class="btn primary" data-act="mock-next" ${mock.at===mock.questions.length-1?'disabled':''}>Next →</button></div><div class="line"></div><button class="btn danger" data-act="mock-submit">Submit exam for grading</button> <span class="small muted">Unanswered questions are marked incorrect.</span></section>`}
function mainArea(){return mode==='sources'?renderSources():mode==='learn'?renderLesson():mode==='dashboard'?renderDashboard():mode==='flash'?renderFlash():mode==='review'?renderReview():mode==='random'?renderRandom():renderMock()}
function render(preserveScroll=false){let y=window.scrollY;$('app').innerHTML=renderHeader()+`<div class="layout">${sidebar()}<main class="maincol" id="mainContent">${storageWarning?`<div class="notification">${esc(storageWarning)}</div>`:''}${mainArea()}</main>${rightPanel()}</div><footer class="footer">Animation Quest · Computer Animation · Exam 1 · ${LESSONS.length} lessons · ${TERMS.length} terms · ${QUESTIONS.length} questions · No account or server required · Study data stays on this browser</footer>`;updateDemos();if(preserveScroll)window.scrollTo(0,y)}
function tierQs(){return QBYLESSON[currentLesson].filter(q=>q.tier===tier)}
function scrollToQuiz(){requestAnimationFrame(()=>{const el=$('quiz');if(el)el.scrollIntoView({behavior:'instant',block:'start'})})}
function quickRerender(){render(true)}
function searchTerms(value){const txt=value.toLowerCase().trim();const wrap=$('searchResults');if(!wrap)return;if(txt.length<2){wrap.style.display='none';return}const scored=LESSONS.map(l=>({l,score:(l.title.toLowerCase().includes(txt)?6:0)+(l.first.toLowerCase().includes(txt)?3:0)+(l.points.some(x=>x.toLowerCase().includes(txt))?2:0)+(l.terms.some(t=>t.name.toLowerCase().includes(txt))?5:0)})).filter(x=>x.score).sort((a,b)=>b.score-a.score).slice(0,6);const termMatches=TERMS.filter(t=>t.name.toLowerCase().includes(txt)||t.definition.toLowerCase().includes(txt)).slice(0,9);wrap.innerHTML=`<div class="eyebrow" style="padding:6px 10px">Lessons</div>${scored.map(({l})=>`<button class="searchitem" data-act="lesson" data-id="${l.id}">📘 <b>${esc(l.title)}</b><div class="tiny muted">${esc(MODBY[l.module].subtitle)}</div></button>`).join('')||'<div class="small muted" style="padding:8px">No matching lesson</div>'}<div class="line" style="margin:4px"></div><div class="eyebrow" style="padding:6px 10px">Concepts</div>${termMatches.map(t=>`<button class="searchitem" data-act="search-term" data-id="${t.lesson}" data-index="${t.id.split('#')[1]}"><b>${esc(t.name)}</b><div class="tiny muted">${esc(LESSONBY[t.lesson].title)}</div></button>`).join('')||'<div class="small muted" style="padding:8px">No matching concept</div>'}`;wrap.style.display='block'}
$('app').addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.id,idx=Number(el.dataset.index);if(act==='noop')return;
 if(act==='home'){pickLesson('opengl');return}
 if(act==='high-yield'){pickLesson('highyield');return}
 if(act==='mode'){setMode(el.dataset.mode);return}
 if(act==='lesson'){pickLesson(id);return}
 if(act==='search-term'){pickLesson(id,idx);return}
 if(act==='toggle-module'){menuOpen[id]=!menuOpen[id];quickRerender();return}
 if(act==='module-first'){pickLesson(LESSONS.find(l=>l.module===id).id);return}
 if(act==='lesson-prev'||act==='lesson-next'){const n=lessonNeighbors();pickLesson(act==='lesson-prev'?n.prev.id:n.next.id);return}
 if(act==='mark-read'){progress.lessonRead[id]=!progress.lessonRead[id];save();quickRerender();return}
 if(act==='tier'){tier=el.dataset.tier;questionNum=Math.max(0,tierQs().findIndex(q=>!progress.done[q.id]));quickRerender();scrollToQuiz();return}
 if(act==='question-index'){questionNum=idx;quickRerender();scrollToQuiz();return}
 if(act==='question-prev'||act==='question-next'){questionNum=Math.min(tierQs().length-1,Math.max(0,questionNum+(act==='question-next'?1:-1)));quickRerender();scrollToQuiz();return}
 if(act==='select-choice'){
 const q=QBY[el.dataset.qid];if(!q||feedback[q.id]||el.disabled)return;let p=answers[q.id];if(q.type==='multi'){const v=Array.isArray(p)?[...p]:[];const i=v.indexOf(idx);if(i>=0)v.splice(i,1);else v.push(idx);setAnswers(q.id,v.sort((a,b)=>a-b))}else setAnswers(q.id,idx);quickRerender();return}
 if(act==='submit-answer'){const q=QBY[el.dataset.qid];if(!q||feedback[q.id]||!hasPicked(q,answers[q.id]))return;const ok=isCorrect(q,answers[q.id]);record(q,ok);feedback[q.id]={correct:ok};quickRerender();return}
 if(act==='retry'){delete feedback[el.dataset.qid];delete answers[el.dataset.qid];quickRerender();return}
 if(act==='reset-all'){if(confirm('Reset ALL Animation Quest progress, missed history, flashcards and mock scores? This cannot be undone.')){progress=freshProgress();answers={};feedback={};mock=null;if(examTimerId)clearInterval(examTimerId);mode='dashboard';save();render();window.scrollTo(0,0)}return}
 if(act==='flash-module'){flashModule=id;flashIndex=0;flashFlip=false;quickRerender();return}
 if(act==='flash-filter'){flashFilter=id;flashIndex=0;flashFlip=false;quickRerender();return}
 if(act==='flash-flip'){flashFlip=!flashFlip;quickRerender();return}
 if(act==='flash-prev'||act==='flash-next'){const n=flashPool().length;flashIndex=n?(flashIndex+(act==='flash-next'?1:-1)+n)%n:0;flashFlip=false;quickRerender();return}
 if(act==='flash-known'||act==='flash-needs'){const t=flashPool()[flashIndex];if(!t)return;if(act==='flash-known'){progress.flashKnown[t.id]=true;delete progress.flashNeeds[t.id]}else{progress.flashNeeds[t.id]=true;const n=flashPool().length;flashIndex=n?(flashIndex+1)%n:0}flashFlip=false;save();quickRerender();return}
 if(act==='flash-reset-module'||act==='flash-reset-all'){if(!confirm(act==='flash-reset-all'?'Reset ALL flashcard flags?':'Reset flashcards for this topic?'))return;const pool=TERMS.filter(t=>act==='flash-reset-all'||t.module===flashModule);pool.forEach(t=>{delete progress.flashKnown[t.id];delete progress.flashNeeds[t.id]});flashIndex=0;flashFlip=false;save();quickRerender();return}
 if(act==='review-filter'){reviewIncludeSolved=id==='all';reviewIndex=0;quickRerender();return}
 if(act==='review-index'){reviewIndex=idx;quickRerender();return}
 if(act==='review-prev'||act==='review-next'){reviewIndex=Math.min(missedList().length-1,Math.max(0,reviewIndex+(act==='review-next'?1:-1)));quickRerender();return}
 if(act==='random-generate'){drawRandom();return}
 if(act==='random-index'){randomIndex=idx;quickRerender();return}
 if(act==='random-prev'||act==='random-next'){randomIndex=Math.min(randomQuestions.length-1,Math.max(0,randomIndex+(act==='random-next'?1:-1)));quickRerender();return}
 if(act==='mock-start'){if(mock&&!mock.submitted&&!confirm('Discard your current mock attempt and start a new one?'))return;startMock();return}
 if(act==='mock-index'){if(mock&&!mock.submitted){mock.at=idx;save();quickRerender()}return}
 if(act==='mock-prev'||act==='mock-next'){mock.at=Math.max(0,Math.min(mock.questions.length-1,mock.at+(act==='mock-next'?1:-1)));save();quickRerender();return}
 if(act==='mock-pick'){if(!mock||mock.submitted)return;const q=mock.questions[mock.at];let v=mock.answers[q.id];if(q.type==='multi'){v=Array.isArray(v)?[...v]:[];const i=v.indexOf(idx);if(i>=0)v.splice(i,1);else v.push(idx);mock.answers[q.id]=v.sort((a,b)=>a-b)}else mock.answers[q.id]=idx;save();quickRerender();return}
 if(act==='mock-submit'){submitMock();return}
});
$('app').addEventListener('change',e=>{if(e.target.id==='randomScope'){randomScope=e.target.value;randomQuestions=[];randomIndex=0;quickRerender()}});
$('app').addEventListener('input',e=>{if(e.target.id==='siteSearch')searchTerms(e.target.value)});
document.addEventListener('click',e=>{if(!e.target.closest('.searchwrap')){const r=$('searchResults');if(r)r.style.display='none'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const r=$('searchResults');if(r)r.style.display='none'}if((e.key===' '||e.key==='Enter')&&e.target.classList.contains('flashcard')){e.preventDefault();flashFlip=!flashFlip;quickRerender()}});
if(progress.savedMock&&Array.isArray(progress.savedMock.questions)&&progress.savedMock.questions.length>0&&Number.isFinite(progress.savedMock.endAt)&&progress.savedMock.questions.every(id=>QBY[id])){mock={...progress.savedMock,questions:progress.savedMock.questions.map(id=>QBY[id])};if(mock.submitted){const counts={};for(const q of mock.questions){const c=counts[q.module]??=( {right:0,total:0});c.total++;if(isCorrect(q,mock.answers[q.id]))c.right++;}mock.weak=Object.entries(counts).map(([id,c])=>({id,pct:percent(c.right,c.total),...c})).sort((a,b)=>a.pct-b.pct);}if(!mock.submitted){mode='mock';examTimerId=setInterval(tickMock,1000);}}
render();if(mock&&!mock.submitted)tickMock();
// An in-page audit surface for automated smoke tests (read-only, no external services).
window.ANIMATION_QUEST_AUDIT={getLessons:()=>LESSONS.length,getQuestions:()=>QUESTIONS.length,getTerms:()=>TERMS.length,checkIntegrity:()=>({duplicateIds:QUESTIONS.length-new Set(QUESTIONS.map(q=>q.id)).size,missingLessons:QUESTIONS.filter(q=>!LESSONBY[q.lesson]).length,badAnswers:QUESTIONS.filter(q=>q.type==='multi'?(q.answer.some(i=>i<0||i>=q.options.length)||new Set(q.answer).size!==q.answer.length):q.answer<0||q.answer>=q.options.length).length,emptyModules:MODS.filter(m=>!LESSONS.some(l=>l.module===m.id)).length})};


$('app').addEventListener('input',e=>{if(!e.target.dataset.demo)return;const k=e.target.dataset.demo,v=Number(e.target.value);if(['tx','scale','angle'].includes(k))demo.transform[k]=v;if(['p1','p2','t'].includes(k))demo.bezier[k]=v;if(['a','b'].includes(k))demo.robotics[k]=v;updateDemos();});

</script></body></html>
