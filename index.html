function flashPool(){return TERMS.filter(t=>t.module===flashModule&&!progress.flashKnown[t.id]&&(flashFilter==='all'||progress.flashNeeds[t.id]))}
function renderFlash(){const pool=flashPool();if(flashIndex>=pool.length)flashIndex=0;const t=pool[flashIndex];const known=TERMS.filter(t=>t.module===flashModule&&progress.flashKnown[t.id]).length,all=TERMS.filter(t=>t.module===flashModule).length;
return `<div class="panel hero modehero"><div class="eyebrow">Recall practice</div><h1>Concept flashcards</h1><p>Flip for the explanation; mark terms as “I know this” or “Needs review.” Known cards disappear from the active deck; progress persists locally.</p><div class="statline"><span class="pill">${known} / ${all} known in ${MODBY[flashModule].name}</span><span class="pill">${pool.length} in current deck</span></div></div><div class="panel section"><div class="tabs">${MODS.map(m=>`<button class="tier ${flashModule===m.id?'active':''}" style="--tier:${m.color}" data-act="flash-module" data-id="${m.id}">${m.name}</button>`).join('')}</div><div class="settingsrow"><button class="btn small ${flashFilter==='all'?'active':''}" data-act="flash-filter" data-id="all">All unmastered</button><button class="btn small ${flashFilter==='needs'?'active':''}" data-act="flash-filter" data-id="needs">Needs review</button><span class="pill" style="margin-left:auto">${pool.length?flashIndex+1:0} / ${pool.length}</span></div>${!t?`<div class="empty">${flashFilter==='needs'?'No cards marked “Needs review” in this topic. Switch to All unmastered.':'You have marked every term in this topic as known!'}<div style="margin-top:14px"><button class="btn" data-act="flash-reset-module">Reset this topic</button></div></div>`:
 `<div class="flashcard ${flashFlip?'back':'front'}" data-act="flash-flip" role="button" tabindex="0" aria-label="Flip current flashcard"><div class="flash-label">${flashFlip?'Back · definition':'Front · recall first'}</div>${flashFlip?`<h2>${esc(t.name)}</h2><p>${esc(t.definition)}</p><div class="small soft">Recognition cue: ${esc(t.cue)}</div>`:`<h2>${esc(t.name)}</h2><p style="margin-top:18px">What does this mean? Click to flip.</p>`}</div><div class="quizfooter"><button class="btn" data-act="flash-prev">← Previous</button><button class="btn" data-act="flash-flip">⟳ Flip</button><button class="btn" data-act="flash-next">Next →</button></div><div class="quizfooter"><button class="btn" data-act="flash-needs">↺ Needs review</button><button class="btn primary" data-act="flash-known">✓ I know this</button></div>`}<div class="line"></div><div class="studyline"><button class="btn small" data-act="flash-reset-module">Reset current topic</button><button class="btn small danger" data-act="flash-reset-all">Reset all flashcards</button></div></div>`}
function renderReview(){const missed=missedList();if(reviewIndex>=missed.length)reviewIndex=Math.max(0,missed.length-1);const q=missed[reviewIndex];return `<div class="panel hero modehero"><div class="eyebrow">Deliberate practice</div><h1>Review Missed</h1><p>Return to questions you previously answered incorrectly. Unresolved misses are shown by default; you can also include already-mastered mistakes.</p><div class="statline"><span class="pill">${allMisses().length} ever missed</span><span class="pill">${QUESTIONS.filter(q=>progress.misses[q.id]&&!progress.done[q.id]).length} unresolved</span></div></div><div class="panel section"><div class="settingsrow"><button class="btn small ${!reviewIncludeSolved?'active':''}" data-act="review-filter" data-id="unresolved">Unresolved</button><button class="btn small ${reviewIncludeSolved?'active':''}" data-act="review-filter" data-id="all">All previously missed</button></div>${q?`<div class="studyline"><span class="qcounter">${reviewIndex+1} / ${missed.length} · Missed ${progress.misses[q.id]} time(s)</span><span class="small soft">${esc(LESSONBY[q.lesson].title)}</span></div>${quizNav(missed,reviewIndex,'review-index') }<div class="line"></div>${questionCard(q)}<div class="quizfooter"><button class="btn" data-act="review-prev" ${reviewIndex===0?'disabled':''}>← Previous</button><button class="btn primary" data-act="review-next" ${reviewIndex===missed.length-1?'disabled':''}>Next →</button></div>`:`<div class="empty">${allMisses().length?'No unresolved misses. All previously missed questions are mastered!':'No missed questions yet. Misses from lessons and mock exams will appear here.'}</div>`}</div>`}
function drawRandom(){let pool=randomScope==='all'?QUESTIONS:QUESTIONS.filter(q=>q.module===randomScope);const selected=[];const rem=[...pool];while(rem.length&&selected.length<15){const idx=Math.floor(Math.random()*rem.length);selected.push(rem.splice(idx,1)[0])}randomQuestions=selected;randomIndex=0;render()}
function renderRandom(){if(randomIndex>=randomQuestions.length)randomIndex=0;const q=randomQuestions[randomIndex];return `<div class="panel hero modehero"><div class="eyebrow">Quick randomized practice</div><h1>Random Practice</h1><p>Practice up to 15 questions from all topics or one topic, with immediate feedback and retries.</p></div><div class="panel section"><div class="settingsrow"><label class="soft" for="randomScope">Question pool</label><select class="select" id="randomScope" data-act="random-scope"><option value="all" ${randomScope==='all'?'selected':''}>All topics</option>${MODS.map(m=>`<option value="${m.id}" ${randomScope===m.id?'selected':''}>${esc(m.name)} · ${esc(m.subtitle)}</option>`).join('')}</select><button class="btn primary" data-act="random-generate">⤨ Generate 15 questions</button></div>${q?`<div class="studyline"><span class="qcounter">${randomIndex+1} / ${randomQuestions.length} · ${esc(LESSONBY[q.lesson].title)}</span></div>${quizNav(randomQuestions,randomIndex,'random-index')}<div class="line"></div>${questionCard(q)}<div class="quizfooter"><button class="btn" data-act="random-prev" ${randomIndex===0?'disabled':''}>← Previous</button><button class="btn primary" data-act="random-next" ${randomIndex===randomQuestions.length-1?'disabled':''}>Next →</button></div>`:`<div class="empty"><h3>Ready to practice?</h3><p>Choose a topic scope and generate a fresh short practice set.</p></div>`}</div>`}
function randomShuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeExamQuestions(){const main=MODS.filter(m=>['m1','m2','m3','m4','m5'].includes(m.id));const pickFormat=kind=>{const selected=[];for(const m of main)for(const t of TIERS){const pool=QUESTIONS.filter(q=>q.examEligible&&q.module===m.id&&q.tier===t&&q.kind===kind);if(!pool.length)throw new Error('Missing exam pool: '+m.id+' / '+t+' / '+kind);selected.push(randomShuffle(pool)[0]);}return randomShuffle(selected);};return [...pickFormat('tf'),...pickFormat('mcq')];}
function startMock(){const selected=makeExamQuestions();mock={questions:selected,answers:{},at:0,endAt:Date.now()+75*60000,duration:75*60,submitted:false,score:null,results:[],weak:[]};mode='mock';if(examTimerId)clearInterval(examTimerId);examTimerId=setInterval(tickMock,1000);save();render();window.scrollTo(0,0);}
function tickMock(){if(!mock||mock.submitted){clearInterval(examTimerId);return}let rem=Math.max(0,Math.ceil((mock.endAt-Date.now())/1000));const el=$('mockTimer');if(el)el.textContent=formatTime(rem);if(rem<=0)submitMock(true)}
function formatTime(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function submitMock(expired=false){if(!mock||mock.submitted)return;if(!expired&&!confirm('Submit the entire mock exam for grading? Solutions will be revealed only after submission.'))return;mock.submitted=true;if(examTimerId)clearInterval(examTimerId);let correct=0;const graded=[];const moduleCounts={};for(const q of mock.questions){const ans=mock.answers[q.id];const ok=isCorrect(q,ans);if(ok){correct++;progress.done[q.id]=true}else{delete progress.done[q.id];progress.misses[q.id]=(progress.misses[q.id]||0)+1}if(!moduleCounts[q.module])moduleCounts[q.module]={right:0,total:0};moduleCounts[q.module].total++;if(ok)moduleCounts[q.module].right++;graded.push({id:q.id,correct:ok,selected:ans})}mock.results=graded;mock.score=percent(correct,mock.questions.length);mock.weak=Object.entries(moduleCounts).map(([id,x])=>({id,pct:percent(x.right,x.total),...x})).sort((a,b)=>a.pct-b.pct);progress.mockLatest=mock.score;progress.mockBest=Math.max(progress.mockBest??0,mock.score);progress.mockHistory=[{date:new Date().toISOString(),score:mock.score,total:mock.questions.length},...(progress.mockHistory||[])].slice(0,12);save();render()}
function renderMock(){if(!mock)return `<div class="panel hero modehero"><div class="eyebrow">Timed simulated assessment</div><h1>Mock Exam · 75 minutes</h1><p>40 questions in the announced format: 20 true/false followed by 20 multiple choice. Practice questions cover the five main topic groups; supplementary sample topics are excluded. Move back and forth freely; answers and explanations stay hidden until you submit.</p><div class="statsgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><b>40</b><small>20 T/F + 20 MCQ</small></div><div class="stat"><b>75:00</b><small>timer</small></div><div class="stat"><b>${progress.mockBest==null?'—':progress.mockBest+'%'}</b><small>best score</small></div></div><button class="btn primary" data-act="mock-start">Begin mock exam →</button></div>`;
const answered=mock.questions.filter(q=>hasPicked(q,mock.answers[q.id])).length;const q=mock.questions[mock.at];if(mock.submitted)return `<div class="panel hero modehero"><div class="eyebrow">Mock exam results</div><h1>Exam submitted</h1><div class="examresults" style="margin-top:15px"><strong class="score">${mock.score}%</strong><p>${mock.results.filter(r=>r.correct).length} / ${mock.questions.length} correct · Best: ${progress.mockBest}% · Latest: ${progress.mockLatest}%</p><p class="small muted">All explanations are available below. Incorrect items were added to Review Missed.</p></div><div class="studyline" style="margin-top:14px"><button class="btn primary" data-act="mock-start">Try a new mock exam</button><button class="btn" data-act="mode" data-mode="review">Review missed items</button></div></div>
<section class="panel section"><h2>Weak topics & lesson focus</h2><p class="small soft" style="margin-top:5px">Sorted from lowest to highest performance on this attempt.</p><div class="module-cards" style="margin-top:13px">${mock.weak.map(x=>`<div class="module-card" style="--mc:${MODBY[x.id].color}"><h3>${esc(MODBY[x.id].name)} — ${esc(MODBY[x.id].subtitle)}</h3><div class="bar"><i style="width:${x.pct}%"></i></div><p>${x.right} / ${x.total} correct (${x.pct}%)</p></div>`).join('')}</div></section>
<section class="panel section"><h2>Complete answer review</h2><p class="small soft" style="margin-top:6px">Each answer includes the supported explanation. Open the linked lesson for more context.</p>${mock.questions.map((q,i)=>{const r=mock.results[i],ans=mock.answers[q.id];const a=(q.type==='multi'?(ans||[]):Number.isInteger(ans)?[ans]:[]);return `<div class="review-item"><div class="studyline"><span class="${r.correct?'pass':'fail'}">${r.correct?'✓ Correct':'✗ Incorrect'} · Question ${i+1}</span>${modChip(q.module)}</div><h3 style="margin-bottom:8px">${fmt(q.q)}</h3><p class="small soft"><b>Your answer:</b> ${a.length?a.map(j=>String.fromCharCode(65+j)+'. '+q.options[j]).map(esc).join('; '):'Unanswered'}</p><p class="small" style="color:#9eedc8"><b>Correct answer:</b> ${esc(answerNames(q))}</p><p class="small soft">${esc(q.sol)}</p><button class="btn small" data-act="lesson" data-id="${q.lesson}">Study ${esc(LESSONBY[q.lesson].title)} →</button></div>`}).join('')}</section>`;
return `<div class="panel hero modehero"><div class="studyline"><div><div class="eyebrow">Mock exam · ${mock.at<20?'True / False':'Multiple Choice'} · solutions hidden</div><h1>Question ${mock.at+1} of ${mock.questions.length}</h1></div><div class="pill mono" style="font-size:17px;color:#9df3cf" id="mockTimer">${formatTime(Math.max(0,Math.ceil((mock.endAt-Date.now())/1000)))}</div></div><div class="bar" style="margin:14px 0"><i style="width:${percent(answered,mock.questions.length)}%"></i></div><div class="small soft">${answered} / ${mock.questions.length} answered · 75-minute timed attempt · ${mock.at<20?'T/F section':'MCQ section'}</div></div>
<section class="panel section"><div class="studyline"><span class="eyebrow">Question navigator</span><span class="pill">${esc(LESSONBY[q.lesson].title)}</span></div><div class="examgrid">${mock.questions.map((qq,i)=>`<button type="button" class="qnum ${i===mock.at?'current':''} ${hasPicked(qq,mock.answers[qq.id])?'answered':''}" data-act="mock-index" data-index="${i}" aria-label="Go to question ${i+1}">${i+1}</button>`).join('')}</div><div class="line"></div>${examQuestion(q,mock.answers[q.id],false)}<div class="quizfooter"><button class="btn" data-act="mock-prev" ${mock.at===0?'disabled':''}>← Previous</button><button class="btn primary" data-act="mock-next" ${mock.at===mock.questions.length-1?'disabled':''}>Next →</button></div><div class="line"></div><button class="btn danger" data-act="mock-submit">Submit exam for grading</button> <span class="small muted">Unanswered questions are marked incorrect.</span></section>`}
function mainArea(){return mode==='sources'?renderSources():mode==='learn'?renderLesson():mode==='dashboard'?renderDashboard():mode==='flash'?renderFlash():mode==='review'?renderReview():mode==='random'?renderRandom():renderMock()}
function render(preserveScroll=false){let y=window.scrollY;$('app').innerHTML=renderHeader()+`<div class="layout">${sidebar()}<main class="maincol" id="mainContent">${storageWarning?`<div class="notification">${esc(storageWarning)}</div>`:''}${mainArea()}</main>${rightPanel()}</div><footer class="footer">Animation Quest · Computer Animation · Exam 1 · ${LESSONS.length} lessons · ${TERMS.length} terms · ${QUESTIONS.length} questions · No account or server required · Study data stays on this browser</footer>`;updateDemos();if(preserveScroll)window.scrollTo(0,y)}
function tierQs(){return QBYLESSON[currentLesson].filter(q=>q.tier===tier)}
function scrollToQuiz(){requestAnimationFrame(()=>{const el=$('quiz');if(el)el.scrollIntoView({behavior:'instant',block:'start'})})}
function quickRerender(){render(true)}
function searchTerms(value){const txt=value.toLowerCase().trim();const wrap=$('searchResults');if(!wrap)return;if(txt.length<2){wrap.style.display='none';return}const scored=LESSONS.map(l=>({l,score:(l.title.toLowerCase().includes(txt)?6:0)+(l.first.toLowerCase().includes(txt)?3:0)+(l.points.some(x=>x.toLowerCase().includes(txt))?2:0)+(l.terms.some(t=>t.name.toLowerCase().includes(txt))?5:0)})).filter(x=>x.score).sort((a,b)=>b.score-a.score).slice(0,6);const termMatches=TERMS.filter(t=>t.name.toLowerCase().includes(txt)||t.definition.toLowerCase().includes(txt)).slice(0,9);wrap.innerHTML=`<div class="eyebrow" style="padding:6px 10px">Lessons</div>${scored.map(({l})=>`<button class="searchitem" data-act="lesson" data-id="${l.id}">📘 <b>${esc(l.title)}</b><div class="tiny muted">${esc(MODBY[l.module].subtitle)}</div></button>`).join('')||'<div class="small muted" style="padding:8px">No matching lesson</div>'}<div class="line" style="margin:4px"></div><div class="eyebrow" style="padding:6px 10px">Concepts</div>${termMatches.map(t=>`<button class="searchitem" data-act="search-term" data-id="${t.lesson}" data-index="${t.id.split('#')[1]}"><b>${esc(t.name)}</b><div class="tiny muted">${esc(LESSONBY[t.lesson].title)}</div></button>`).join('')||'<div class="small muted" style="padding:8px">No matching concept</div>'}`;wrap.style.display='block'}
$('app').addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.id,idx=Number(el.dataset.index);if(act==='noop')return;
 if(act==='home'){pickLesson('opengl');return}
 if(act==='high-yield'){pickLesson('highyield');return}
 if(act==='mode'){setMode(el.dataset.mode);return}
 if(act==='lesson'){pickLesson(id);return}
 if(act==='search-term'){pickLesson(id,idx);return}
 if(act==='toggle-module'){menuOpen[id]=!menuOpen[id];quickRerender();return}
 if(act==='module-first'){pickLesson(LESSONS.find(l=>l.module===id).id);return}
 if(act==='lesson-prev'||act==='lesson-next'){const n=lessonNeighbors();pickLesson(act==='lesson-prev'?n.prev.id:n.next.id);return}
 if(act==='mark-read'){progress.lessonRead[id]=!progress.lessonRead[id];save();quickRerender();return}
 if(act==='tier'){tier=el.dataset.tier;questionNum=Math.max(0,tierQs().findIndex(q=>!progress.done[q.id]));quickRerender();scrollToQuiz();return}
 if(act==='question-index'){questionNum=idx;quickRerender();scrollToQuiz();return}
 if(act==='question-prev'||act==='question-next'){questionNum=Math.min(tierQs().length-1,Math.max(0,questionNum+(act==='question-next'?1:-1)));quickRerender();scrollToQuiz();return}
 if(act==='select-choice'){
 const q=QBY[el.dataset.qid];if(!q||feedback[q.id]||el.disabled)return;let p=answers[q.id];if(q.type==='multi'){const v=Array.isArray(p)?[...p]:[];const i=v.indexOf(idx);if(i>=0)v.splice(i,1);else v.push(idx);setAnswers(q.id,v.sort((a,b)=>a-b))}else setAnswers(q.id,idx);quickRerender();return}
 if(act==='submit-answer'){const q=QBY[el.dataset.qid];if(!q||feedback[q.id]||!hasPicked(q,answers[q.id]))return;const ok=isCorrect(q,answers[q.id]);record(q,ok);feedback[q.id]={correct:ok};quickRerender();return}
 if(act==='retry'){delete feedback[el.dataset.qid];delete answers[el.dataset.qid];quickRerender();return}
 if(act==='reset-all'){if(confirm('Reset ALL Animation Quest progress, missed history, flashcards and mock scores? This cannot be undone.')){progress=freshProgress();answers={};feedback={};mock=null;if(examTimerId)clearInterval(examTimerId);mode='dashboard';save();render();window.scrollTo(0,0)}return}
 if(act==='flash-module'){flashModule=id;flashIndex=0;flashFlip=false;quickRerender();return}
 if(act==='flash-filter'){flashFilter=id;flashIndex=0;flashFlip=false;quickRerender();return}
 if(act==='flash-flip'){flashFlip=!flashFlip;quickRerender();return}
 if(act==='flash-prev'||act==='flash-next'){const n=flashPool().length;flashIndex=n?(flashIndex+(act==='flash-next'?1:-1)+n)%n:0;flashFlip=false;quickRerender();return}
 if(act==='flash-known'||act==='flash-needs'){const t=flashPool()[flashIndex];if(!t)return;if(act==='flash-known'){progress.flashKnown[t.id]=true;delete progress.flashNeeds[t.id]}else{progress.flashNeeds[t.id]=true;const n=flashPool().length;flashIndex=n?(flashIndex+1)%n:0}flashFlip=false;save();quickRerender();return}
 if(act==='flash-reset-module'||act==='flash-reset-all'){if(!confirm(act==='flash-reset-all'?'Reset ALL flashcard flags?':'Reset flashcards for this topic?'))return;const pool=TERMS.filter(t=>act==='flash-reset-all'||t.module===flashModule);pool.forEach(t=>{delete progress.flashKnown[t.id];delete progress.flashNeeds[t.id]});flashIndex=0;flashFlip=false;save();quickRerender();return}
 if(act==='review-filter'){reviewIncludeSolved=id==='all';reviewIndex=0;quickRerender();return}
 if(act==='review-index'){reviewIndex=idx;quickRerender();return}
 if(act==='review-prev'||act==='review-next'){reviewIndex=Math.min(missedList().length-1,Math.max(0,reviewIndex+(act==='review-next'?1:-1)));quickRerender();return}
 if(act==='random-generate'){drawRandom();return}
 if(act==='random-index'){randomIndex=idx;quickRerender();return}
 if(act==='random-prev'||act==='random-next'){randomIndex=Math.min(randomQuestions.length-1,Math.max(0,randomIndex+(act==='random-next'?1:-1)));quickRerender();return}
 if(act==='mock-start'){if(mock&&!mock.submitted&&!confirm('Discard your current mock attempt and start a new one?'))return;startMock();return}
 if(act==='mock-index'){if(mock&&!mock.submitted){mock.at=idx;save();quickRerender()}return}
 if(act==='mock-prev'||act==='mock-next'){mock.at=Math.max(0,Math.min(mock.questions.length-1,mock.at+(act==='mock-next'?1:-1)));save();quickRerender();return}
 if(act==='mock-pick'){if(!mock||mock.submitted)return;const q=mock.questions[mock.at];let v=mock.answers[q.id];if(q.type==='multi'){v=Array.isArray(v)?[...v]:[];const i=v.indexOf(idx);if(i>=0)v.splice(i,1);else v.push(idx);mock.answers[q.id]=v.sort((a,b)=>a-b)}else mock.answers[q.id]=idx;save();quickRerender();return}
 if(act==='mock-submit'){submitMock();return}
});
$('app').addEventListener('change',e=>{if(e.target.id==='randomScope'){randomScope=e.target.value;randomQuestions=[];randomIndex=0;quickRerender()}});

if(progress.savedMock&&Array.isArray(progress.savedMock.questions)&&progress.savedMock.questions.length>0&&Number.isFinite(progress.savedMock.endAt)&&progress.savedMock.questions.every(id=>QBY[id])){mock={...progress.savedMock,questions:progress.savedMock.questions.map(id=>QBY[id])};if(mock.submitted){const counts={};for(const q of mock.questions){const c=counts[q.module]??=( {right:0,total:0});c.total++;if(isCorrect(q,mock.answers[q.id]))c.right++;}mock.weak=Object.entries(counts).map(([id,c])=>({id,pct:percent(c.right,c.total),...c})).sort((a,b)=>a.pct-b.pct);}if(!mock.submitted){mode='mock';examTimerId=setInterval(tickMock,1000);}}
render();if(mock&&!mock.submitted)tickMock();
